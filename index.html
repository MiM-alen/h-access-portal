<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page | Access Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;600;700&display=swap');
        body { font-family: 'Noto Sans Ethiopic', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Login Form -->
    <div class="flex-grow flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full">
            <div id="formSection">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                        <i class="fa-solid fa-file-shield text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold">ENTER YOUR NAME TO ACCESS THE FILE</h1>
                    <p class="text-sm text-slate-400 mt-2">Please Enter Your Name Correctly!</p>
                </div>

                <form onsubmit="startAccess(event)" class="space-y-5">
                    <div>
                        <input type="text" id="userName" required placeholder="FULL NAME" 
                        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold shadow-lg transition transform active:scale-95">
                       START/CONTINUE<i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </form>
            </div>

            <!-- DISPLAY SUCCESSFULLY -->
            <div id="successSection" class="hidden text-center py-8">
                <div class="text-emerald-400 text-5xl mb-4 animate-bounce">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h2 class="text-xl font-bold">Succeeded!</h2>
                <p class="text-slate-400 mt-2">We’re taking you to the document...</p>
                <div class="mt-6 flex justify-center">
                    <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
            </div>
        </div>
    </div>




    <!-- ......................................... -->

    <footer class="p-4 flex justify-between text-[10px] text-slate-600 border-t border-slate-900">
        <span>© 2026 Document Sharing</span>
        <button onclick="showAdmin()" class="hover:text-indigo-400 underline">Admin's Room</button>
    </footer>




    <!-- ................................. -->
    <div id="adminModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-lg w-full">
            <div class="flex justify-between mb-4 border-b border-slate-800 pb-2">
                <h3 class="font-bold text-indigo-400 uppercase">Control Center</h3>
                <button onclick="closeAdmin()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="mb-4">
                <label class="text-[10px] text-slate-500">የዋን ድራይቭ ሊንክ እዚህ ያስገቡ፦</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="odLink" placeholder="https://..." class="flex-grow bg-black p-2 rounded text-xs border border-slate-800">
                    <button onclick="saveLink()" class="bg-indigo-600 px-3 py-1 rounded text-xs font-bold">ሴቭ</button>
                </div>
            </div>
            <div class="max-h-40 overflow-y-auto text-xs space-y-2" id="logs"></div>
            <div class="mt-4 flex justify-end">
                <button onclick="clearLogs()" class="text-rose-500 text-[10px] mr-4">Clear the Form</button>
                <button onclick="closeAdmin()" class="bg-slate-800 px-4 py-2 rounded text-xs">Exit</button>
            </div>
        </div>
    </div>

    <script>



        // 
        function getLink() { return localStorage.getItem('od_link') || "https://onedrive.live.com"; }


        // 
        function startAccess(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const logs = JSON.parse(localStorage.getItem('od_logs')) || [];
            logs.push({ name: name, time: new Date().toLocaleString() });
            localStorage.setItem('od_logs', JSON.stringify(logs));

            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('successSection').classList.remove('hidden');

            setTimeout(() => { window.location.href = getLink(); }, 2000);
        }






        // Addmin Show
        function showAdmin() {
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('odLink').value = getLink();
            const logDiv = document.getElementById('logs');
            const logs = JSON.parse(localStorage.getItem('od_logs')) || [];
            logDiv.innerHTML = logs.reverse().map(l => `<div class="p-2 bg-black/50 rounded flex justify-between"><span>${l.name}</span><span class="text-indigo-500">${l.time}</span></div>`).join('');
        }
        function closeAdmin() { document.getElementById('adminModal').classList.add('hidden'); }
        function saveLink() {
            localStorage.setItem('od_link', document.getElementById('odLink').value);
            alert("ሊንኩ ተቀምጧል!");
        }
        function clearLogs() {
            localStorage.removeItem('od_logs');
            showAdmin();
        }
    </script>
</body>
</html>
